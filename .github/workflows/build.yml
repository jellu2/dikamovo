name: build
on: push
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#181726'
      - name: Add In-App Google Login WebViewClient, Cookies & Background Playback
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />|' "$MANIFEST"

          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          cat << 'JAVA' > "$MAIN_ACT"
          package com.dikamovo.music;

          import android.Manifest;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestAudioPermission();
                  setupWebViewAndAudio();
              }

              private void setupWebViewAndAudio() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "DikamovoMusic::BgAudio");
                          wakeLock.acquire();
                      }
                      WebView wv = getBridge().getWebView();
                      WebSettings ws = wv.getSettings();
                      ws.setMediaPlaybackRequiresUserGesture(false);
                      ws.setDomStorageEnabled(true);
                      ws.setJavaScriptEnabled(true);
                      // Standard Chrome Mobile UA so Google Sign-In allows login inside WebView
                      ws.setUserAgentString("Mozilla/5.0 (Linux; Android 13; V2317) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36");

                      CookieManager cm = CookieManager.getInstance();
                      cm.setAcceptCookie(true);
                      cm.setAcceptThirdPartyCookies(wv, true);

                      wv.setWebViewClient(new WebViewClient() {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                              String url = request.getUrl().toString();
                              // Once login finishes and redirects to YouTube / YT Music, flush cookies and return to Dikamovo Music
                              if (url.startsWith("https://music.youtube.com") || url.startsWith("https://m.youtube.com") || url.startsWith("https://www.youtube.com")) {
                                  CookieManager.getInstance().flush();
                                  view.loadUrl("http://localhost/");
                                  return true;
                              }
                              // Keep accounts.google.com login pages inside this WebView instead of opening Chrome
                              if (url.contains("accounts.google.com") || url.contains("google.com")) {
                                  return false;
                              }
                              return false;
                          }
                      });
                  } catch (Exception ignored) {}
              }

              @Override
              public void onPause() {
                  super.onPause();
                  try {
                      CookieManager.getInstance().flush();
                      WebView wv = getBridge().getWebView();
                      wv.onResume();
                      wv.resumeTimers();
                      wv.dispatchWindowVisibilityChanged(View.VISIBLE);
                  } catch (Exception ignored) {}
              }

              @Override
              public void onStop() {
                  super.onStop();
                  try {
                      WebView wv = getBridge().getWebView();
                      wv.onResume();
                      wv.resumeTimers();
                      wv.dispatchWindowVisibilityChanged(View.VISIBLE);
                  } catch (Exception ignored) {}
              }

              @Override
              public void onDestroy() {
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  } catch (Exception ignored) {}
                  super.onDestroy();
              }

              private void requestAudioPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.READ_MEDIA_AUDIO}, 101);
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 101);
                      }
                  }
              }
          }
          JAVA
          PKG=$(node -e 'console.log(require("./capacitor.config.json").appId)')
          sed -i "s|package com.dikamovo.music;|package $PKG;|" "$MAIN_ACT"
      - run: npx cap sync
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dikamovo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
