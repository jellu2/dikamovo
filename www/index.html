<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dikamovo Music</title>
<style>
:root{color-scheme:dark;--bg:#0b0b10;--s:#15151d;--s2:#1e1e29;--tx:#f2f2f7;--mu:#9a9aae;--a:#8b5cf6;--b:#22d3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
header{padding:16px 16px 4px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:600}
main{padding:0 16px;max-width:640px;margin:auto}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--s2);color:var(--mu)}.on{color:#4ade80}
.row{display:flex;align-items:center;gap:10px;background:var(--s);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row .t{flex:1;min-width:0}.t b,.t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}small{color:var(--mu)}
button,select,textarea,input[type=text]{font:inherit;color:var(--tx);background:var(--s2);border:0;border-radius:10px;padding:9px 12px}
button{cursor:pointer}.p{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:600}
.ic{width:38px;height:38px;border-radius:50%;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip.sel{background:var(--a)}
textarea{width:100%;min-height:80px;resize:vertical}input[type=range]{width:100%;accent-color:var(--a)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#101017;border-top:1px solid var(--s2);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border-radius:0;font-size:12px;color:var(--mu);padding:12px 2px}nav .sel{color:var(--tx);box-shadow:inset 0 2px var(--a)}
#mini{position:fixed;left:8px;right:8px;bottom:calc(52px + env(safe-area-inset-bottom,0px));background:var(--s2);border-radius:14px;padding:10px 12px;z-index:4;display:flex;align-items:center;gap:10px}
#bar{height:4px;background:var(--bg);border-radius:4px;margin-top:6px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}
.tl{position:relative;height:30px;background:var(--s2);border-radius:8px;overflow:hidden;margin:8px 0}.tl i{position:absolute;top:0;bottom:0}
canvas{width:100%;height:150px;background:#0f0f18;border-radius:10px;touch-action:none;margin:8px 0}input[type=number]{font:inherit;color:var(--tx);background:var(--s2);border:0;border-radius:8px;padding:8px}label.btn{display:inline-block;padding:11px 16px;border-radius:10px;cursor:pointer}label.r{display:flex;justify-content:space-between;color:var(--mu);margin-top:10px}
</style></head><body>
<header><h1>Dikamovo Music</h1><span id="net" class="badge"></span></header>
<main id="v"></main>
<div id="mini"><button class="ic" data-a="prev">⏮</button><button class="ic p" data-a="pp" id="pp">▶</button><button class="ic" data-a="next">⏭</button><div style="flex:1;min-width:0"><b id="mt">Nothing playing</b><small id="ms" style="display:block"></small><div id="bar"><i></i></div></div></div>
<nav id="nav"></nav>
<script>
const MOODS=["calm","focus","happy","energetic","melancholy","dreamy"],REL={calm:["dreamy","focus"],focus:["calm"],happy:["energetic"],energetic:["happy"],melancholy:["dreamy","calm"],dreamy:["calm","melancholy"]};
const SC={M:[0,2,4,7,9],m:[0,3,5,7,10],d:[0,2,3,7,9]};
const DEMO=[];
let S={tracks:DEMO,cues:{},def:{fade:4,in:0,out:0,auto:true},liked:[],pls:[],hifi:false,online:[],mix:null},tab="lib",mood="calm",en=.5,ai=[],pv="",sel="",toast="";
try{const x=JSON.parse(localStorage.getItem("dk")||"null");if(x)S={...S,...x}}catch(e){}
S.tracks=S.tracks.filter(t=>t.file);S.online=S.online||[];S.thr=S.thr||{s:-25,m:-15,e:-28};const save=()=>{try{localStorage.setItem("dk",JSON.stringify(S))}catch(e){}};
const T=id=>S.tracks.find(t=>t.id===id)||S.online.find(t=>t.id===id),$=s=>document.querySelector(s);
const cue=id=>({...(S.def.auto?{in:S.def.in,out:S.def.out,fade:S.def.fade}:{in:0,out:0,fade:0}),...(S.cues[id]||{})});
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
// storage for imported audio (offline)
const db=()=>new Promise((r,j)=>{const q=indexedDB.open("dk",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>r(q.result);q.onerror=j});
async function idb(m,k,v){const d=await db();return new Promise((r,j)=>{const s=d.transaction("f",m==="get"?"readonly":"readwrite").objectStore("f");const q=m==="get"?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=j})}
// audio engine
let ctx,cur=null,old=[],queue=[],qi=-1,playing=false,trans=false;
function C(){if(!ctx){const o={latencyHint:S.hifi?"playback":"interactive"};if(S.hifi)o.sampleRate=96000;try{ctx=new AudioContext(o)}catch(e){ctx=new AudioContext()}}if(ctx.state==="suspended"&&playing)ctx.resume();return ctx}
async function load(t){const c=C(),g=c.createGain();g.connect(c.destination);
 let a=new Audio(),fake=0;const src=t.file?URL.createObjectURL(await idb("get",t.id)):t.url;
 const ready=()=>new Promise(r=>{a.onloadedmetadata=()=>r(1);a.onerror=()=>r(0)});
 if(t.online)a.crossOrigin="anonymous";a.preload="auto";a.src=src;let ok=await ready();
 if(!ok&&t.online){a=new Audio(src);ok=await ready();fake=1}
 if(!ok)throw 0;
 let G=g;
 if(fake)G={gain:{set value(v){a.volume=v},setValueCurveAtTime(cv,w,d){a.volume=cv[0];const s=performance.now(),i=setInterval(()=>{const k=Math.min(1,(performance.now()-s)/1e3/d);a.volume=cv[Math.min(cv.length-1,Math.floor(k*cv.length))];if(k>=1)clearInterval(i)},50)}}};
 else c.createMediaElementSource(a).connect(g);
 const dur=a.duration||t.dur||30;t.dur=dur;
 return{t,g:G,dur,start(o){a.currentTime=o;a.play()},stop(){a.pause();try{g.disconnect()}catch(e){}},pos:()=>a.currentTime,pause(){a.pause()},resume(){a.play()}}}
async function play(i,off){queue[i]&&(qi=i);const t=T(queue[i]);if(!t)return;trans=true;[cur,...old].forEach(e=>e&&e.stop());old=[];const e=await load(t).catch(()=>null);if(!e){trans=false;return}cur=e;e.start(off??cue(t.id).in);{const fi=cue(t.id).fi||0;if(fi>0&&off==null){const N=32;e.g.gain.setValueCurveAtTime(Float32Array.from({length:N},(_,k)=>k/(N-1)),C().currentTime,fi)}}trans=false;playing=true;C();ui()}
async function transition(){if(trans)return;trans=true;const ni=(qi+1)%queue.length,nt=T(queue[ni]),c=C(),f=cue(cur.t.id).fade,e=await load(nt).catch(()=>null),o=cur,w=c.currentTime,N=32;
 const up=Float32Array.from({length:N},(_,k)=>Math.sin(k/(N-1)*Math.PI/2)),dn=up.slice().reverse();
 if(!e){qi=ni;trans=false;return}e.start(cue(nt.id).in);cur=e;qi=ni;
 if(f>0){e.g.gain.setValueCurveAtTime(up,w,f);o.g.gain.setValueCurveAtTime(dn,w,f)}else o.g.gain.value=0;
 old.push(o);setTimeout(()=>{o.stop();old=old.filter(x=>x!==o)},f*1000+80);trans=false;ui()}
setInterval(()=>{if(!cur||!playing||trans)return;const c=cue(cur.t.id),p=cur.pos(),end=cur.dur-c.out;
 if(queue.length>1&&p>=end-c.fade)transition();else if(p>=end){playing=false;ui()}
 $("#bar i").style.width=Math.max(0,Math.min(100,(p-c.in)/(end-c.in)*100))+"%"},150);
function setQ(ids,i=0){queue=ids;play(i)}
function pp(){if(!cur)return setQ(S.tracks.map(t=>t.id));if(playing){playing=false;ctx.suspend();cur.pause()}else{playing=true;ctx.resume();cur.resume()}ui()}
function ui(){const t=cur&&cur.t;$("#mt").textContent=t?t.title:"Nothing playing";$("#ms").textContent=t?t.artist+" · "+t.mood+(S.hifi?" · Hi-Fi":""):"";$("#pp").textContent=playing?"⏸":"▶"}
// engines
function recommend(m,e,n=6){return S.tracks.map(t=>({t,s:(t.mood===m?2:REL[m].includes(t.mood)?1:0)+(1-Math.abs(t.energy-e))+(S.liked.includes(t.id)?.4:0)})).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.t)}
async function genAI(p){const q=p.toLowerCase(),K={calm:/calm|chill|relax|sleep|rain|quiet/,focus:/focus|study|work|cod|read/,happy:/happy|sun|summer|upbeat|good/,energetic:/workout|gym|run|energ|party|hype|fast/,melancholy:/sad|melanchol|lonely|cry|rainy/,dreamy:/dream|night|late|drive|space/};
 let ms=MOODS.filter(m=>K[m].test(q));const mm=ms[0]||"calm";if(!ms.length)ms=MOODS;const n=/\b(\d{1,2})\b/.test(q)?Math.min(12,+RegExp.$1):6;
 let pool=S.tracks.map(t=>({t,s:(ms.includes(t.mood)?2:0)+Math.random()*.5})).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.t);
 if(/wind down|sleep|relax/.test(q))pool.sort((a,b)=>b.energy-a.energy);else if(/build|workout|warm/.test(q))pool.sort((a,b)=>a.energy-b.energy);
 else if(pool.length>2){pool.sort((a,b)=>a.bpm-b.bpm);const o=[pool.shift()];while(pool.length){const l=o[o.length-1];pool.sort((a,b)=>Math.abs(a.bpm-l.bpm)-Math.abs(b.bpm-l.bpm));o.push(pool.shift())}pool=o}
 const on=await search(q.replace(/\d+/g,"").trim().slice(0,40)||mm+" music",3,mm,.5),out=[];
 pool.forEach((t,i)=>{out.push(t);if(i%2===1&&on.length)out.push(on.shift())});return out.concat(on)}
const PK={},r1=x=>Math.round(x*10)/10,f1=x=>fmt(x)+"."+Math.floor(x%1*10);let mk="start",drag=false;
async function getPeaks(id){if(PK[id])return PK[id];const f=await idb("get",id);if(!f)return null;try{const b=await C().decodeAudioData(await f.arrayBuffer()),d=b.getChannelData(0),N=600,p=new Float32Array(N),z=Math.floor(d.length/N);for(let i=0;i<N;i++){let m=0;for(let j=i*z;j<(i+1)*z;j+=8){const a=Math.abs(d[j]);if(a>m)m=a}p[i]=m}T(id).dur=b.duration;PK[id]={p,d:b.duration};save();return PK[id]}catch(e){return null}}
function mks(){const c=cue(sel),d=T(sel).dur||60,end=d-c.out;return{start:c.in,end,next:Math.max(c.in,end-c.fade),d}}
async function drawWF(){const cv=$("#wf");if(!cv)return;const id=sel,g=cv.getContext("2d"),W=cv.width,H=cv.height;g.clearRect(0,0,W,H);g.font="bold 20px system-ui";const k=await getPeaks(id);if(!$("#wf")||id!==sel)return;
 if(!k){g.fillStyle="#9a9aae";g.fillText("No waveform for this track",20,H/2);return}
 const m=mks(),x=v=>v/k.d*W,n=k.p.length;g.fillStyle="#8b5cf6";k.p.forEach((v,i)=>{const h=Math.max(2,v*H*.9);g.fillRect(i*W/n,(H-h)/2,Math.max(1,W/n-1),h)});
 g.fillStyle="rgba(0,0,0,.6)";g.fillRect(0,0,x(m.start),H);g.fillRect(x(m.end),0,W-x(m.end),H);g.fillStyle="rgba(34,211,238,.2)";g.fillRect(x(m.next),0,x(m.end)-x(m.next),H);
 [["start","#fb923c","START"],["next","#22d3ee","NEXT"],["end","#ef4444","END"]].forEach(([q,col,lb])=>{g.fillStyle=col;g.fillRect(x(m[q])-(mk===q?3:1),0,mk===q?6:2,H);g.fillText(lb,Math.min(W-75,x(m[q])+6),24);const e=$("#t-"+q);if(e)e.textContent=f1(m[q])})}
function setMk(ev){const cv=$("#wf"),k=PK[sel];if(!cv||!k)return;const r=cv.getBoundingClientRect(),t=r1(Math.max(0,Math.min(k.d,(ev.clientX-r.left)/r.width*k.d))),c=cue(sel),end=k.d-c.out,n={};
 if(mk==="start")n.in=Math.min(t,end-1);else if(mk==="end"){const e=Math.max(t,c.in+1);n.out=r1(k.d-e);n.fade=Math.min(c.fade,r1(e-c.in))}else n.fade=r1(Math.max(0,Math.min(12,end-Math.max(t,c.in))));
 S.cues[sel]={...c,...n};drawWF()}
async function autoSel(){const k=await getPeaks(sel);if(!k)return;const th=S.thr,g=d=>10**(d/20),N=k.p.length,last=d=>{for(let i=N-1;i>=0;i--)if(k.p[i]>=g(d))return i;return N-1},s0=Math.max(0,k.p.findIndex(v=>v>=g(th.s))),e0=Math.max(last(th.e)+1,s0+1),n0=Math.min(last(th.m)+1,e0),t=i=>i/N*k.d;
 S.cues[sel]={...cue(sel),in:r1(t(s0)),out:r1(k.d-t(e0)),fade:r1(Math.min(12,t(e0)-t(n0)))}}
document.addEventListener("pointerdown",e=>{if(e.target.id==="wf"){drag=true;e.target.setPointerCapture(e.pointerId);setMk(e)}});
document.addEventListener("pointermove",e=>{if(drag)setMk(e)});document.addEventListener("pointerup",()=>{if(drag){drag=false;save()}});
let busy="";const setBusy=x=>{busy=x;const e=$("#st");if(e)e.textContent=x};
async function search(term,n,m,en){try{const r=await fetch("https://itunes.apple.com/search?media=music&limit="+n+"&term="+encodeURIComponent(term)),j=await r.json(),o=[];
 for(const x of j.results||[]){if(!x.previewUrl)continue;const id="o"+x.trackId;let t=S.online.find(y=>y.id===id);if(!t){t={id,title:x.trackName,artist:x.artistName,mood:m,bpm:100,energy:en,online:1,url:x.previewUrl,dur:30};S.online.push(t)}o.push(t)}
 S.online=S.online.slice(-60);save();return o}catch(e){return[]}}
async function analyze(f){try{if(f.size>30e6)return null;const c=C(),b=await c.decodeAudioData(await f.arrayBuffer()),d=b.getChannelData(0),sr=b.sampleRate,s=Math.floor(Math.max(0,d.length/2-15*sr)),e=Math.min(d.length,s+30*sr);let sum=0,zc=0;
 for(let i=s;i<e;i++){sum+=d[i]*d[i];if(i>s&&(d[i]>0)!==(d[i-1]>0))zc++}const n=e-s,rms=Math.sqrt(sum/n),v=Math.min(1,zc/n*sr/2/4000);
 const hop=Math.floor(sr/100),env=[];for(let i=s;i+hop<e;i+=hop){let m=0;for(let j=0;j<hop;j+=4)m+=Math.abs(d[i+j]);env.push(m)}
 let best=0,bl=50;for(let l=30;l<=100;l++){let r=0;for(let i=0;i+l<env.length;i++)r+=env[i]*env[i+l];if(r>best){best=r;bl=l}}
 let bpm=6000/bl;while(bpm<70)bpm*=2;while(bpm>180)bpm/=2;
 return{bpm:Math.round(bpm),energy:Math.max(0,Math.min(1,+(rms*4+(bpm-60)/300).toFixed(2))),v}}catch(e){return null}}
const guess=(e,v)=>e>.7?(v>.5?"energetic":"happy"):e>.5?(v>.5?"happy":"focus"):e>.3?(v>.5?"dreamy":"calm"):(v>.5?"calm":"melancholy");
async function analyzeMissing(){const todo=S.tracks.filter(t=>!t.an);let i=0;for(const t of todo){setBusy("Analyzing mood "+ ++i+"/"+todo.length+"…");const r=await analyze(await idb("get",t.id));t.an=1;if(r){t.bpm=r.bpm;t.energy=r.energy;t.mood=guess(r.energy,r.v)}save()}setBusy("");view()}
async function addFiles(fs){let i=0;for(const f of fs){setBusy("Adding "+ ++i+"/"+fs.length+"…");const key=f.name+f.size;if(S.tracks.some(t=>t.key===key))continue;const id="f"+Date.now()+i,n=f.name.replace(/\.[^.]+$/,""),p=n.split(" - ");await idb("put",id,f);
 S.tracks.push({id,key,title:p.length>1?p.slice(1).join(" - "):n,artist:p.length>1?p[0]:"Unknown",mood:"calm",energy:.5,bpm:100,file:1,dur:0});save()}
 view();await analyzeMissing();S.mix=null;await autoMix()}
async function autoMix(){if(!S.tracks.length)return;const day=new Date().toDateString();if(S.mix&&S.mix.day===day)return;const h=new Date().getHours(),m=h<11?"focus":h<17?"happy":h<22?"calm":"dreamy",en=h<17?.65:.35,mine=recommend(m,en,8);
 const arts=[...new Set(S.tracks.map(t=>t.artist).filter(a=>a!=="Unknown"))].slice(0,3);let on=[];
 for(const a of (arts.length?arts:[m+" music"]))on=on.concat(await search(a,2,m,en));
 const ids=[];mine.forEach((t,i)=>{ids.push(t.id);if(i%2===1&&on.length)ids.push(on.shift().id)});on.forEach(t=>ids.push(t.id));
 S.mix={day,ids:[...new Set(ids)],m};save();view()}
function mixHTML(){if(!S.mix)return"";const a=S.mix.ids.map(T).filter(Boolean);return`<h2>Made for you today · ${S.mix.m}</h2>${list(a)}<p><button data-a="mix">Refresh mix</button></p>`}
async function boot(){await analyzeMissing();await autoMix()}
// views
const row=(t,ids)=>`<div class="row"><button class="ic p" data-a="play" data-ids="${ids}" data-id="${t.id}">▶</button><div class="t"><b>${t.title}</b><small>${t.artist} · ${t.mood} · ${t.bpm} BPM</small></div><span class="badge on">${t.online?"online · 30s preview":"saved offline"}</span><button class="ic" data-a="like" data-id="${t.id}">${S.liked.includes(t.id)?"♥":"♡"}</button></div>`;
const list=a=>a.map(t=>row(t,a.map(x=>x.id).join(","))).join("");
function sl(k,l,min,max,st,v,u){return`<label class="r"><span>${l}</span><span id="o-${k}">${v}${u}</span></label><input type="range" data-k="${k}" min="${min}" max="${max}" step="${st}" value="${v}">`}
function view(){let h="";if(!T(sel)&&S.tracks.length)sel=S.tracks[0].id;
 if(tab==="lib")h=`<p><label class="p btn">Scan my phone music<input type="file" id="fi" accept="audio/*" multiple hidden></label></p><small id="st">${busy||S.tracks.length+" tracks in your library"}</small>${S.tracks.length?"":"<p><small>Tap Scan, open your Music folder and select all songs. They are saved in the app, so next time it opens with your library ready.</small></p>"}${list(S.tracks)}`;
 if(tab==="mood")h=`<h2>How do you feel?</h2><div class="chips">${MOODS.map(m=>`<button class="chip ${m===mood?"sel":""}" data-a="mood" data-id="${m}">${m}</button>`).join("")}</div>${sl("en","Energy",0,1,.05,en,"")}<h2>Recommended</h2>${list(recommend(mood,en))}`;
 if(tab==="ai")h=mixHTML()+`<h2>AI playlist creator</h2><textarea id="pr" placeholder="e.g. 8 songs to wind down after a late night drive">${pv}</textarea><p><button class="p" data-a="gen">Create playlist</button></p>${ai.length?`<h2>Result</h2>${list(ai)}<button data-a="savepl">Save playlist</button>`:""}${S.pls.length?`<h2>Saved</h2>${S.pls.map((p,i)=>`<div class="row"><div class="t"><b>${p.n}</b><small>${p.ids.length} tracks</small></div><button class="ic p" data-a="playpl" data-id="${i}">▶</button></div>`).join("")}`:""}`;
 if(tab==="cue"&&!T(sel))h="<h2>Cue editor</h2><small>Add music in Library first.</small>";if(tab==="cue"&&T(sel)){const c=cue(sel),m=mks(),th=S.thr;h=`<h2>Cue editor</h2><select id="ct" style="width:100%">${S.tracks.map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${x.title}</option>`).join("")}</select>
 <canvas id="wf" width="720" height="220"></canvas>
 <div class="chips">${[["start","START"],["next","NEXT"],["end","END"]].map(([n,l])=>`<button class="chip ${mk===n?"sel":""}" data-a="mk" data-id="${n}">${l} <b id="t-${n}">${f1(m[n])}</b></button>`).join("")}</div>
 <small>Pick a marker, then tap or drag on the waveform. START = where the song begins, NEXT = when the next song starts mixing in, END = where it stops.</small>
 ${sl("fi","Fade in",0,10,.5,c.fi||0,"s")}
 <h2>Auto select thresholds (dB)</h2><div class="chips">${[["s","Start"],["m","Mix"],["e","End"]].map(([k,l])=>`<label>${l} <input type="number" data-k="th-${k}" value="${th[k]}" min="-60" max="0" style="width:72px"></label>`).join("")}</div>
