<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dikamovo Music</title>
<style>
:root{color-scheme:dark;--bg:#0b0b10;--s:#15151d;--s2:#1e1e29;--tx:#f2f2f7;--mu:#9a9aae;--a:#8b5cf6;--b:#22d3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
header{padding:16px 16px 4px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:600}
main{padding:0 16px;max-width:640px;margin:auto}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--s2);color:var(--mu)}.on{color:#4ade80}
.row{display:flex;align-items:center;gap:10px;background:var(--s);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row .t{flex:1;min-width:0}.t b,.t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}small{color:var(--mu)}
button,select,textarea,input[type=text],input[type=search]{font:inherit;color:var(--tx);background:var(--s2);border:0;border-radius:10px;padding:9px 12px}
button{cursor:pointer}.p{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:600}
.ic{width:38px;height:38px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip.sel{background:var(--a);color:#fff}
textarea{width:100%;min-height:80px;resize:vertical}input[type=range]{width:100%;accent-color:var(--a)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#101017;border-top:1px solid var(--s2);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border-radius:0;font-size:11px;color:var(--mu);padding:12px 2px}nav .sel{color:var(--tx);box-shadow:inset 0 2px var(--a)}
#mini{position:fixed;left:8px;right:8px;bottom:calc(52px + env(safe-area-inset-bottom,0px));background:var(--s2);border-radius:14px;padding:10px 12px;z-index:4;display:flex;align-items:center;gap:10px;cursor:pointer}
#bar{height:4px;background:var(--bg);border-radius:4px;margin-top:6px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}
canvas#wf{width:100%;height:150px;background:#0f0f18;border-radius:10px;touch-action:none;margin:8px 0}input[type=number]{font:inherit;color:var(--tx);background:var(--s2);border:0;border-radius:8px;padding:8px}label.btn{display:inline-block;padding:11px 16px;border-radius:10px;cursor:pointer}label.r{display:flex;justify-content:space-between;color:var(--mu);margin-top:10px}
.sbar{display:flex;gap:8px;margin:10px 0}.sbar input{flex:1}

/* Equalizer Grid */
.eq-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;margin:10px 0}
.eq-col{display:flex;flex-direction:column;align-items:center;background:var(--s);padding:10px 4px;border-radius:10px}
.eq-col input[type=range]{writing-mode:vertical-lr;direction:rtl;width:24px;height:90px;accent-color:var(--b);margin:6px 0}
.eq-col small{font-size:11px;color:var(--mu)}
.eq-col b{font-size:11px;color:var(--b)}

/* Full-Screen YouTube Music Style Player with Circular Visualizer */
#np{position:fixed;inset:0;background:linear-gradient(180deg,#23222a 0%,#121216 100%);z-index:20;display:flex;flex-direction:column;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 24px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
#np.open{transform:translateY(0)}
.np-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.np-pill-sw{display:flex;background:rgba(255,255,255,.08);border-radius:99px;padding:3px}
.np-pill-sw span{padding:5px 14px;border-radius:99px;font-size:13px;color:var(--mu);cursor:pointer}
.np-pill-sw span.act{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.np-viz-wrap{width:100%;max-width:340px;height:290px;margin:6px auto;display:flex;align-items:center;justify-content:center;position:relative}
canvas#np-cv{width:100%;height:100%;display:block;border-radius:20px}
.np-meta h3{margin:0;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-meta p{margin:4px 0 0;color:var(--mu);font-size:15px}
.np-actions{display:flex;gap:10px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.np-actions::-webkit-scrollbar{display:none}
.act-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:500;white-space:nowrap;color:#fff}
.act-pill.on{background:rgba(139,92,246,.35);color:#e9d5ff}
.np-prog{margin:6px 0}
.np-prog input[type=range]{width:100%;height:4px;accent-color:#fff;cursor:pointer}
.np-times{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:4px}
.np-ctrl{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.np-ctrl button{background:none;color:#fff;padding:8px;font-size:22px}
.np-ctrl button.dim{color:var(--mu)}
.np-ctrl .play-big{width:68px;height:68px;border-radius:50%;background:#fff;color:#121216;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.np-foot{text-align:center;padding-top:6px}
.np-grab{width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);margin:0 auto 8px}
.np-foot small{font-size:13px;color:#d4d4d8;font-weight:500}
.np-drawer{background:rgba(0,0,0,.35);border-radius:14px;padding:12px;margin-top:8px;max-height:190px;overflow-y:auto;font-size:13px;line-height:1.6}
</style></head><body>
<header><h1>Dikamovo Music</h1><span id="net" class="badge"></span></header>
<main id="v"></main>

<div id="mini" data-a="opennp">
  <button class="ic" data-a="prev">⏮</button>
  <button class="ic p" data-a="pp" id="pp">▶</button>
  <button class="ic" data-a="next">⏭</button>
  <div style="flex:1;min-width:0"><b id="mt">Nothing playing</b><small id="ms" style="display:block"></small><div id="bar"><i></i></div></div>
</div>

<!-- Full-Screen Now Playing -->
<div id="np">
  <div class="np-top">
    <button class="ic" style="background:none;font-size:20px" data-a="closenp">⌄</button>
    <div class="np-pill-sw"><span class="act">Song</span><span data-a="gocue">Cues</span></div>
    <button class="ic" style="background:none;font-size:18px" data-a="goai">✦</button>
  </div>

  <!-- Live Circular / Linear Waveform Synchronizer -->
  <div class="np-viz-wrap" data-a="cyclewf" title="Tap to switch visualizer style">
    <canvas id="np-cv" width="600" height="520"></canvas>
  </div>

  <div>
    <div class="np-meta">
      <h3 id="np-title">Nothing playing</h3>
      <p id="np-artist">Select a track to start</p>
    </div>

    <div class="np-actions">
      <button class="act-pill" id="np-like" data-a="nplike">👍 <span id="np-lktxt">Like</span></button>
      <button class="act-pill" data-a="npdrawer" data-id="eq">🎛 Equalizer</button>
      <button class="act-pill" data-a="npdrawer" data-id="queue">☰ Up Next</button>
      <button class="act-pill" id="np-save" data-a="npsave">⬇ Save Offline</button>
      <button class="act-pill" data-a="gocue">✂ Cue Mix</button>
    </div>

    <div id="np-box"></div>

    <div class="np-prog">
      <input type="range" id="np-seek" min="0" max="100" step="0.1" value="0">
      <div class="np-times"><span id="np-cur">0:00</span><span id="np-dur">0:00</span></div>
    </div>

    <div class="np-ctrl">
      <button id="np-shuf" class="dim" data-a="shuf">⇄</button>
      <button data-a="prev">⏮</button>
      <button class="play-big" id="np-pp" data-a="pp">▶</button>
      <button data-a="next">⏭</button>
      <button id="np-rep" class="dim" data-a="rep">↻</button>
    </div>
  </div>

  <div class="np-foot" data-a="npdrawer" data-id="queue">
    <div class="np-grab"></div>
    <small id="np-mixname">Dikamovo Mix</small>
  </div>
</div>

<div id="yt-box" style="position:fixed;left:-9999px;width:200px;height:200px;opacity:0;pointer-events:none"><div id="yt-player"></div></div>
<nav id="nav"></nav>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const MOODS=["calm","focus","happy","energetic","Sabay Sabay!","melancholy","relapse","dreamy"];
const REL={
  calm:["dreamy","focus"],
  focus:["calm"],
  happy:["Sabay Sabay!","energetic"],
  energetic:["Sabay Sabay!","happy"],
  "Sabay Sabay!":["energetic","happy"],
  melancholy:["relapse","dreamy","calm"],
  relapse:["melancholy","dreamy","calm"],
  dreamy:["calm","relapse","melancholy"]
};
const PLATFORMS=[
  {id:"all",n:"All Platforms"},
  {id:"ytm",n:"YouTube Music"},
  {id:"spotify",n:"Spotify"},
  {id:"apple",n:"Apple Music"},
  {id:"deezer",n:"Deezer"}
];
const WF_STYLES=[
  {id:"radbars",n:"Circle A: Radial Bars"},
  {id:"halo",n:"Circle B: Bass Halo Ring"},
  {id:"vinyl",n:"Circle C: DJ Vinyl Orbit"},
  {id:"bars",n:"Linear A: Glowing Bars"},
  {id:"wave",n:"Linear B: Neon Wave"},
  {id:"dual",n:"Linear C: DJ Dual-Deck"}
];
const EQ_PRESETS=[
  {n:"Flat",g:[0,0,0,0,0]},
  {n:"Sabay Sabay! (Club)",g:[6,3,-1,3,5]},
  {n:"Bass Boost",g:[8,4,0,-2,1]},
  {n:"Radio / Vocal",g:[-2,1,4,3,1]},
  {n:"Relapse Acoustic",g:[3,2,0,2,4]},
  {n:"OPM / Pop",g:[2,1,0,2,3]}
];
const DEFAULT_FOLDERS=["Music","Music/Relapse Music","Music/Best New Tagalog","Music/Hot Hits Philippines","Music/TikTok","Music/tiktok","Music/Viral 50 - Philippines","Music/Tagapag Ligtas","Music/Exercise Music","Music/VideoToMP3","Download","Dikamovo"];

let S={
  tracks:[],cues:{},def:{fade:4,in:0,out:0,auto:true},liked:[],pls:[],
  hifi:false,offlineOnly:false,online:[],mix:null,
  wfStyle:"radbars",
  eq:{on:true,preset:"Flat",bands:[0,0,0,0,0]},
  folders:[...DEFAULT_FOLDERS]
};
let tab="lib",mood="calm",en=.5,ai=[],pv="",aiSrc="all",sq="",sres=[],sel="",toast="",shuf=false,rep=true,npOpen=false,npDrawer="",seeking=false;

try{const x=JSON.parse(localStorage.getItem("dk")||"null");if(x)S={...S,...x}}catch(e){}
S.tracks=S.tracks.filter(t=>t.file && !/\.(m4a|wav|ogg|opus|aac)$/i.test(t.key||"") && !/record|ringtone|voice|call/i.test((t.key||"")+" "+t.title));
S.online=(S.online||[]).filter(x=>x.verifiedFull);
S.thr=S.thr||{s:-25,m:-15,e:-28};
S.wfStyle=S.wfStyle||"radbars";
S.eq=S.eq||{on:true,preset:"Flat",bands:[0,0,0,0,0]};
S.folders=Array.isArray(S.folders)&&S.folders.length?S.folders:[...DEFAULT_FOLDERS];

const save=()=>{try{localStorage.setItem("dk",JSON.stringify(S))}catch(e){}};
const T=id=>S.tracks.find(t=>t.id===id)||S.online.find(t=>t.id===id),$=s=>document.querySelector(s);
const cue=id=>({...(S.def.auto?{in:S.def.in,out:S.def.out,fade:S.def.fade}:{in:0,out:0,fade:0}),...(S.cues[id]||{})});
const fmt=s=>!isFinite(s)||s<0?"0:00":Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

// IndexedDB
const db=()=>new Promise((r,j)=>{const q=indexedDB.open("dk",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>r(q.result);q.onerror=j});
async function idb(m,k,v){const d=await db();return new Promise((r,j)=>{const s=d.transaction("f",m==="get"?"readonly":"readwrite").objectStore("f");const q=m==="get"?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=j})}

// Audio Engine + 5-Band EQ + Analyser Node
let ytP=null,ytReady=false;
window.onYouTubeIframeAPIReady=()=>{
  ytP=new YT.Player("yt-player",{
    height:"200",width:"200",
    playerVars:{autoplay:1,controls:0,playsinline:1,rel:0,modestbranding:1},
    events:{
      onReady:()=>{ytReady=true},
      onStateChange:(e)=>{
        if(e.data===YT.PlayerState.ENDED&&playing&&!trans){
          if(queue.length>1||rep)transition();else{playing=false;ui()}
        }
      }
    }
  });
};

let ctx,masterIn,eqFilters=[],analyser,cur=null,old=[],queue=[],qi=-1,playing=false,trans=false;
function C(){
  if(!ctx){
    const o={latencyHint:S.hifi?"playback":"interactive"};
    if(S.hifi)o.sampleRate=96000;
    try{ctx=new AudioContext(o)}catch(e){ctx=new AudioContext()}
    masterIn=ctx.createGain();
    analyser=ctx.createAnalyser();
    analyser.fftSize=256;
    const freqs=[60,230,910,3600,14000];
    eqFilters=freqs.map((fq,i)=>{
      const f=ctx.createBiquadFilter();
      f.type=i===0?"lowshelf":i===4?"highshelf":"peaking";
      f.frequency.value=fq;
      f.gain.value=S.eq.on?(S.eq.bands[i]||0):0;
      return f;
    });
    masterIn.connect(eqFilters[0]);
    for(let i=0;i<eqFilters.length-1;i++)eqFilters[i].connect(eqFilters[i+1]);
    eqFilters[eqFilters.length-1].connect(analyser);
    analyser.connect(ctx.destination);
  }
  if(ctx.state==="suspended"&&playing)ctx.resume();
  return ctx;
}
function applyEQ(){
  if(!eqFilters.length)return;
  S.eq.bands.forEach((g,i)=>{if(eqFilters[i])eqFilters[i].gain.value=S.eq.on?g:0});
}

async function load(t){
  if(t.vid){
    if(!ytReady||!ytP)throw 0;
    ytP.loadVideoById({videoId:t.vid,startSeconds:0});
    ytP.setVolume(100);
    await new Promise(r=>setTimeout(r,600));
    const dur=ytP.getDuration()||t.dur||210;
    t.dur=dur;
    const gFake={gain:{
      set value(v){if(ytP&&ytP.setVolume)ytP.setVolume(Math.round(Math.max(0,Math.min(1,v))*100))},
      setValueCurveAtTime(cv,w,d){
        if(!ytP||!ytP.setVolume)return;
        ytP.setVolume(Math.round(cv[0]*100));
        const s=performance.now(),iv=setInterval(()=>{
          const k=Math.min(1,(performance.now()-s)/1e3/d);
          const val=cv[Math.min(cv.length-1,Math.floor(k*cv.length))];
          if(ytP&&ytP.setVolume)ytP.setVolume(Math.round(val*100));
          if(k>=1)clearInterval(iv);
        },50);
      }
    }};
    return{
      t,g:gFake,dur,
      seek(sec){if(ytP&&ytP.seekTo)ytP.seekTo(Math.max(0,Math.min(dur,sec)),true)},
      start(o){if(ytP){if(o>0)ytP.seekTo(o,true);ytP.playVideo()}},
      stop(){if(ytP&&ytP.stopVideo)ytP.stopVideo()},
      pos:()=>(ytP&&ytP.getCurrentTime)?ytP.getCurrentTime():0,
      pause(){if(ytP&&ytP.pauseVideo)ytP.pauseVideo()},
      resume(){if(ytP&&ytP.playVideo)ytP.playVideo()}
    };
  }

  const c=C(),g=c.createGain();g.connect(masterIn);
  let a=new Audio(),fake=0,objUrl=null;
  if(t.fileUri){objUrl=window.Capacitor?window.Capacitor.convertFileSrc(t.fileUri):t.fileUri}
  else if(t.file){const blob=await idb("get",t.id);if(!blob)throw 0;objUrl=URL.createObjectURL(blob)}
  const src=t.file?objUrl:await resolvePlayableUrl(t);
  const ready=()=>new Promise(r=>{a.onloadedmetadata=()=>r(1);a.onerror=()=>r(0)});
  if(t.online)a.crossOrigin="anonymous";a.preload="auto";a.src=src;let ok=await ready();
  if(!ok&&t.online){a=new Audio(src);ok=await ready();fake=1}
  if(!ok){if(objUrl&&!t.fileUri)URL.revokeObjectURL(objUrl);throw 0}
  let G=g;
  if(fake)G={gain:{set value(v){a.volume=v},setValueCurveAtTime(cv,w,d){a.volume=cv[0];const s=performance.now(),i=setInterval(()=>{const k=Math.min(1,(performance.now()-s)/1e3/d);a.volume=cv[Math.min(cv.length-1,Math.floor(k*cv.length))];if(k>=1)clearInterval(i)},50)}}};
  else c.createMediaElementSource(a).connect(g);
  const dur=a.duration||t.dur||180;t.dur=dur;
  return{t,g:G,dur,seek(sec){a.currentTime=Math.max(0,Math.min(dur,sec))},start(o){a.currentTime=o;a.play()},stop(){a.pause();try{g.disconnect()}catch(e){}if(objUrl&&!t.fileUri)URL.revokeObjectURL(objUrl)},pos:()=>a.currentTime,pause(){a.pause()},resume(){a.play()}};
}

function nextIdx(){if(!queue.length)return -1;if(shuf&&queue.length>1){let r;do{r=Math.floor(Math.random()*queue.length)}while(r===qi);return r}return(qi+1)%queue.length}

async function play(i,off,openPlayer=false){queue[i]&&(qi=i);const t=T(queue[i]);if(!t)return;trans=true;[cur,...old].forEach(e=>e&&e.stop());old=[];const e=await load(t).catch(()=>null);if(!e){trans=false;toast="Unable to load track.";ui();view();return}cur=e;e.start(off??cue(t.id).in);
 const fi=cue(t.id).fi||0;if(fi>0&&off==null){const N=32;e.g.gain.setValueCurveAtTime(Float32Array.from({length:N},(_,k)=>k/(N-1)),C().currentTime,fi)}
 trans=false;playing=true;C();if(openPlayer)npOpen=true;ui()}

async function transition(forceIdx){if(trans)return;trans=true;const ni=typeof forceIdx==="number"?forceIdx:nextIdx();if(ni<0){trans=false;return}const nt=T(queue[ni]),c=C(),f=cue(cur.t.id).fade,e=await load(nt).catch(()=>null),o=cur,w=c.currentTime,N=32;
 const up=Float32Array.from({length:N},(_,k)=>Math.sin(k/(N-1)*Math.PI/2)),dn=up.slice().reverse();
 if(!e){qi=ni;trans=false;return}e.start(cue(nt.id).in);cur=e;qi=ni;
 if(f>0){e.g.gain.setValueCurveAtTime(up,w,f);o.g.gain.setValueCurveAtTime(dn,w,f)}else o.g.gain.value=0;
 old.push(o);setTimeout(()=>{o.stop();old=old.filter(x=>x!==o)},f*1000+80);trans=false;ui()}

setInterval(()=>{if(!cur||!playing||trans)return;const c=cue(cur.t.id),p=cur.pos(),end=cur.dur-c.out;
 if((queue.length>1||rep)&&p>=end-c.fade)transition();else if(p>=end){playing=false;ui()}
 const pct=Math.max(0,Math.min(100,(p-c.in)/(end-c.in)*100));
 $("#bar i").style.width=pct+"%";
 if(!seeking){$("#np-seek").max=cur.dur;$("#np-seek").value=p;$("#np-cur").textContent=fmt(p);$("#np-dur").textContent=fmt(cur.dur)}},200);

function setQ(ids,i=0,openPlayer=true){queue=ids;play(i,null,openPlayer)}
function pp(){if(!cur)return setQ(S.tracks.map(t=>t.id),0,true);if(playing){playing=false;ctx&&ctx.suspend();cur.pause()}else{playing=true;ctx&&ctx.resume();cur.resume()}ui()}

// Circular & Linear Waveform Visualizer Renderer
const logoImg=new Image();logoImg.src="logo.png";let logoOk=false;logoImg.onload=()=>{logoOk=true};
const artCache={};
function getArtImg(url){
  if(!url)return null;
  if(!artCache[url]){const im=new Image();im.crossOrigin="anonymous";im.src=url;im.onload=()=>{im.ok=true};artCache[url]=im}
  return artCache[url].ok?artCache[url]:null;
}

const npCv=$("#np-cv"),npG=npCv.getContext("2d"),vizData=new Uint8Array(128);
let vizPhase=0;
function drawVisualizer(){
  requestAnimationFrame(drawVisualizer);
  if(!npOpen)return;
  const W=npCv.width,H=npCv.height,cx=W/2,cy=H/2;
  npG.clearRect(0,0,W,H);
  if(analyser&&playing)analyser.getByteFrequencyData(vizData);
  else if(playing){for(let i=0;i<64;i++)vizData[i]=Math.max(0,110*Math.abs(Math.sin(vizPhase*3+i*0.3)))}
  else vizData.fill(0);
  if(playing)vizPhase+=0.025;

  let bass=0;for(let i=0;i<6;i++)bass+=(vizData[i]||0);
  bass=(bass/6)/255;
  const baseR=102+bass*15;
  const st=S.wfStyle||"radbars";

  if(st==="radbars"||st==="halo"||st==="vinyl"){
    if(st==="radbars"){
      const N=72;
      for(let i=0;i<N;i++){
        const ang=(i/N)*Math.PI*2 - Math.PI/2 + vizPhase*0.25;
        const amp=(vizData[i%48]||0)/255;
        const len=8 + amp*84 + (playing?Math.sin(i*0.4+vizPhase*2)*3:0);
        const x1=cx+Math.cos(ang)*(baseR+6),y1=cy+Math.sin(ang)*(baseR+6);
        const x2=cx+Math.cos(ang)*(baseR+6+len),y2=cy+Math.sin(ang)*(baseR+6+len);
        npG.strokeStyle=i%2===0?"#22d3ee":"#8b5cf6";
        npG.lineWidth=4.5;npG.lineCap="round";
        npG.beginPath();npG.moveTo(x1,y1);npG.lineTo(x2,y2);npG.stroke();
      }
    }else if(st==="halo"){
      for(let ring=0;ring<2;ring++){
        npG.beginPath();
        const pts=90;
        for(let i=0;i<=pts;i++){
          const ang=(i/pts)*Math.PI*2 + (ring===0?vizPhase:-vizPhase);
          const amp=(vizData[(i*2)%48]||0)/255;
          const r=baseR + 12 + ring*16 + amp*(ring===0?52:32)*Math.sin(i*0.3+vizPhase*2);
          const x=cx+Math.cos(ang)*r,y=cy+Math.sin(ang)*r;
          i===0?npG.moveTo(x,y):npG.lineTo(x,y);
        }
        npG.closePath();
        npG.strokeStyle=ring===0?"#22d3ee":"#8b5cf6";
        npG.lineWidth=ring===0?4:2.5;npG.stroke();
      }
    }else{
      const N=64;
      for(let i=0;i<N;i++){
        const ang=(i/N)*Math.PI*2 + vizPhase*0.6;
        const amp=(vizData[i%40]||0)/255;
        const r=baseR + 10 + amp*60;
        const x=cx+Math.cos(ang)*r,y=cy+Math.sin(ang)*r;
        npG.fillStyle=i<N/2?"#22d3ee":"#a855f7";
        npG.beginPath();npG.arc(x,y,4+amp*4,0,Math.PI*2);npG.fill();
      }
    }

    // Center Disc: Track Album Art if available, else Official Dikamovo Logo
    npG.save();
    npG.beginPath();npG.arc(cx,cy,baseR,0,Math.PI*2);npG.clip();
    const t=cur&&cur.t;
    const artIm=t&&t.art?getArtImg(t.art):null;
    if(artIm){
      if(st==="vinyl"){npG.translate(cx,cy);npG.rotate(vizPhase*0.5);npG.translate(-cx,-cy)}
      npG.drawImage(artIm,cx-baseR,cy-baseR,baseR*2,baseR*2);
    }else{
      const grad=npG.createLinearGradient(cx-baseR,cy-baseR,cx+baseR,cy+baseR);
      grad.addColorStop(0,"#222034");grad.addColorStop(1,"#181726");
      npG.fillStyle=grad;npG.fillRect(cx-baseR,cy-baseR,baseR*2,baseR*2);
      if(logoOk){
        npG.drawImage(logoImg,cx-baseR*0.78,cy-baseR*0.78,baseR*1.56,baseR*1.56);
      }else{
        npG.fillStyle="#fff";npG.font="bold 22px system-ui";npG.textAlign="center";
        npG.fillText("DIKAMOVO",cx,cy-2);
        npG.fillStyle="#22d3ee";npG.font="bold 11px system-ui";
        npG.fillText("MUSIC STUDIO",cx,cy+20);
      }
    }
    npG.restore();
    npG.strokeStyle="rgba(139,92,246,0.7)";npG.lineWidth=3;
    npG.beginPath();npG.arc(cx,cy,baseR,0,Math.PI*2);npG.stroke();
  }else if(st==="bars"){
    const N=52,bw=W/N;
    for(let i=0;i<N;i++){
      const amp=(vizData[i%32]||0)/255;
      const idle=playing?Math.abs(Math.sin(i*0.25+vizPhase))*0.15:0.04;
      const h=Math.max(10,(amp*0.85+idle)*H*0.75);
      const grad=npG.createLinearGradient(0,cy-h/2,0,cy+h/2);
      grad.addColorStop(0,"#22d3ee");grad.addColorStop(1,"#8b5cf6");
      npG.fillStyle=grad;
      npG.beginPath();npG.roundRect(i*bw+2,cy-h/2,bw-4,h,4);npG.fill();
    }
  }else if(st==="wave"){
    npG.lineWidth=5;
    const grad=npG.createLinearGradient(0,0,W,0);
    grad.addColorStop(0,"#8b5cf6");grad.addColorStop(0.5,"#22d3ee");grad.addColorStop(1,"#f472b6");
    npG.strokeStyle=grad;
    npG.beginPath();
    for(let x=0;x<W;x+=6){
      const idx=Math.floor((x/W)*32);
      const amp=((vizData[idx]||0)/255)*120+12;
      const y=cy+Math.sin(x*0.025+vizPhase*2)*amp*Math.sin((x/W)*Math.PI);
      x===0?npG.moveTo(x,y):npG.lineTo(x,y);
    }
    npG.stroke();
  }else{
    for(let deck=0;deck<2;deck++){
      const dy=deck===0?H*0.34:H*0.66;
      npG.fillStyle=deck===0?"#8b5cf6":"#22d3ee";
      for(let i=0;i<56;i++){
        const amp=((vizData[(i+deck*8)%32]||0)/255)*70+8;
        npG.fillRect(i*(W/56)+2,dy-amp/2,(W/56)-4,amp);
      }
    }
  }
}

async function searchInnerTube(term,n){
  const r=await fetch("https://www.youtube.com/youtubei/v1/search?prettyPrint=false",{
    method:"POST",
    headers:{"Content-Type":"application/json","User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36"},
    body:JSON.stringify({query:term+" audio",context:{client:{clientName:"WEB",clientVersion:"2.20240530.02.00",hl:"en",gl:"PH"}}}),
    signal:AbortSignal.timeout(7000)
  });
  if(!r.ok)throw 0;
  const data=await r.json();
  const out=[];
  const walk=(obj)=>{
    if(!obj||typeof obj!=="object"||out.length>=n)return;
    if(obj.videoRenderer&&obj.videoRenderer.videoId){
      const v=obj.videoRenderer;
      const title=(v.title&&v.title.runs&&v.title.runs[0]&&v.title.runs[0].text)||"";
      const artist=(v.ownerText&&v.ownerText.runs&&v.ownerText.runs[0]&&v.ownerText.runs[0].text)||"YouTube";
      const durTxt=(v.lengthText&&v.lengthText.simpleText)||"3:30";
      const pts=durTxt.split(":").map(Number);
      const dur=pts.length===2?pts[0]*60+pts[1]:210;
      if(title&&dur>=45&&!out.some(x=>x.vid===v.videoId)){
        out.push({vid:v.videoId,title,artist,art:"https://i.ytimg.com/vi/"+v.videoId+"/hqdefault.jpg",dur});
      }
    }
    for(const k in obj)walk(obj[k]);
  };
  walk(data);
  if(!out.length)throw 0;
  return out;
}

async function search(term,n,m,en,platform="all"){
  if(S.offlineOnly)return[];
  const qRaw=encodeURIComponent(term);
  const o=[];
  try{
    const hits = await searchInnerTube(term,n);
    for(const x of hits.slice(0,n)){
      const id="yt"+x.vid;
      const t={id,vid:x.vid,title:x.title,artist:x.artist,mood:m,bpm:100,energy:en,online:1,verifiedFull:1,src:platform==="spotify"?"Spotify Match":platform==="apple"?"Apple Match":"YouTube Full",url:"",art:x.art,dur:x.dur};
      if(!o.some(k=>k.id===id))o.push(t);
    }
  }catch(e){}
  if(!o.length){
    try{
      const r=await fetch("https://discoveryprovider.audius.co/v1/tracks/search?query="+qRaw+"&limit="+n,{signal:AbortSignal.timeout(5000)});
      if(r.ok){
        const j=await r.json();
        for(const x of j.data||[]){
          if((x.duration||0)<45)continue;
          const id="au"+x.id;
          const t={id,title:x.title,artist:(x.user&&x.user.name)||"Audius",mood:m,bpm:100,energy:en,online:1,verifiedFull:1,src:"Audius Full",url:"https://discoveryprovider.audius.co/v1/tracks/"+x.id+"/stream",art:(x.artwork&&x.artwork["480x480"])||"",dur:x.duration};
          if(!o.some(k=>k.id===id))o.push(t);
        }
      }
    }catch(e){}
  }
  for(const t of o){
    const idx=S.online.findIndex(y=>y.id===t.id);
    if(idx>=0)S.online[idx]={...S.online[idx],...t,url:S.online[idx].url||t.url};
    else S.online.push(t);
  }
  S.online=S.online.slice(-100);save();
  return o.slice(0,n);
}

async function genAI(p){
  const q=p.toLowerCase();
  const K={
    calm:/calm|chill|relax|sleep|rain|quiet/,
    focus:/focus|study|work|cod|read/,
    happy:/happy|sun|summer|upbeat|good/,
    energetic:/workout|gym|run|energ|fast/,
    "Sabay Sabay!":/sabay|party|dance|club|chris brown|2012|tiktok|budots|hype|remix/,
    melancholy:/sad|melanchol|lonely|cry|rainy/,
    relapse:/relapse|hugot|sakit|ex|miss|broken|moving on|sawing/,
    dreamy:/dream|night|late|drive|space/
  };
  let ms=MOODS.filter(m=>K[m].test(q));
  const mm=ms[0]||"calm";
  if(!ms.length)ms=MOODS;
  const n=/\b(\d{1,2})\b/.test(q)?Math.min(12,+RegExp.$1):6;
  let pool=S.tracks.map(t=>({t,s:(ms.includes(t.mood)?2:0)+Math.random()*.5})).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.t);
  if(/wind down|sleep|relax|relapse/.test(q))pool.sort((a,b)=>b.energy-a.energy);
  else if(/build|workout|warm/.test(q))pool.sort((a,b)=>a.energy-b.energy);
  else if(pool.length>2){pool.sort((a,b)=>a.bpm-b.bpm);const o=[pool.shift()];while(pool.length){const l=o[o.length-1];pool.sort((a,b)=>Math.abs(a.bpm-l.bpm)-Math.abs(b.bpm-l.bpm));o.push(pool.shift())}pool=o}

  let searchTerm=q.replace(/\d+/g,"").trim().slice(0,45);
  if(!searchTerm||mm==="Sabay Sabay!"){
    if(mm==="Sabay Sabay!")searchTerm="Chris Brown 2012 party dance hits Usher Pitbull TikTok viral dance Philippines";
    else searchTerm=(mm==="relapse"?"OPM hugot relapse sad songs":mm+" music");
  }else if(mm==="relapse"&&!/opm|song|music/.test(searchTerm))searchTerm+=" OPM hugot songs";

  const on=await search(searchTerm,Math.max(4,n),mm,mm==="relapse"?.3:.5,aiSrc);
  const out=[];
  if(!pool.length)return on.slice(0,n);
  pool.forEach((t,i)=>{out.push(t);if(on.length)out.push(on.shift())});
  return out.concat(on).slice(0,Math.max(n,out.length));
}

let busy="";const setBusy=x=>{busy=x;const e=$("#st");if(e)e.textContent=x};
async function autoScanDevice(manual=false,relinkMode=false){
  const cap=window.Capacitor;
  const FS=cap&&cap.Plugins&&cap.Plugins.Filesystem;
  const logBox=(msg)=>{toast=msg;const el=document.getElementById("scan-log");if(el)el.textContent=msg;const relEl=document.getElementById("relink-log");if(relEl)relEl.textContent=msg;};
  if(!FS){if(manual||relinkMode)logBox("Auto-scan runs inside the Android app.");return}

  try{
    logBox(relinkMode?"Relinking MP3 files in linked folders…":"Scanning linked folders (MP3 only)…");
    try{await FS.requestPermissions()}catch(e){}

    const exts=/\.mp3$/i;
    let added=0,relinked=0,dirsChecked=0,lastErr="";

    async function scanTarget(targetObj, relPrefix, depth=0){
      if(depth>4)return;
      try{
        const res=await FS.readdir(targetObj);
        dirsChecked++;
        for(const item of res.files||[]){
          const name=typeof item==="string"?item:item.name;
          if(!name||name.startsWith(".")||/record|ringtone|voice|notification|alarm/i.test(name))continue;
          const type=typeof item==="string"?(name.includes(".")?"file":"directory"):item.type;
          const nextPath=targetObj.path.endsWith("/")?targetObj.path+name:targetObj.path+"/"+name;
          const nextObj=targetObj.directory?{path:nextPath,directory:targetObj.directory}:{path:nextPath};

          if(type==="directory"){
            await scanTarget(nextObj, relPrefix+"/"+name, depth+1);
          }else if(exts.test(name)){
            let fileUri="";
            if(targetObj.directory){
              const u=await FS.getUri({path:nextPath,directory:targetObj.directory});
              fileUri=u.uri;
            }else{
              fileUri=nextPath.startsWith("file://")?nextPath:"file://"+nextPath;
            }
            const key="cap_"+nextPath;
            const existingByKey=S.tracks.find(t=>t.key===key);
            if(existingByKey){
              if(existingByKey.fileUri!==fileUri){existingByKey.fileUri=fileUri;relinked++}
              continue;
            }
            // Check if moved from another folder (match by filename) so Cue points stay intact
            const existingByName=S.tracks.find(t=>t.fileUri&&t.fileUri.split("/").pop()===name);
            if(existingByName){
              existingByName.key=key;
              existingByName.fileUri=fileUri;
              relinked++;
              continue;
            }

            const id="f"+Date.now()+added;
            const clean=name.replace(/\.[^.]+$/,"");
            const p=clean.split(" - ");
            const folderTag=relPrefix.split("/").pop()||"calm";
            const autoMood=/relapse/i.test(folderTag)?"relapse":/tiktok|party|dance|exercise|viral|hits/i.test(folderTag)?"Sabay Sabay!":"calm";
            S.tracks.push({id,key,title:p.length>1?p.slice(1).join(" - "):clean,artist:p.length>1?p[0]:"Unknown",mood:autoMood,energy:.5,bpm:100,file:1,fileUri,dur:0});
            added++;
            logBox("Found "+added+" MP3s ("+name+")…");
          }
        }
      }catch(e){lastErr=e&&e.message?e.message:String(e)}
    }

    for(const f of S.folders){
      await scanTarget({path:f,directory:"EXTERNAL_STORAGE"}, f, 0);
    }
    if(dirsChecked===0){
      for(const f of S.folders){
        await scanTarget({path:"file:///storage/emulated/0/"+f}, f, 0);
      }
    }

    save();view();
    if(added>0||relinked>0){
      logBox("Done! Added "+added+" new MP3s, relinked "+relinked+" moved tracks.");
      S.mix=null;await autoMix();
    }else if(dirsChecked===0){
      logBox("Permission needed: App Info -> Permissions -> Music and audio -> Allow.");
    }else{
      logBox("Synced ("+dirsChecked+" folders checked). "+S.tracks.length+" MP3 tracks ready.");
    }
  }catch(e){
    logBox("Scan error: "+(e&&e.message?e.message:String(e)));
  }
}

 for(let i=s;i<e;i++){sum+=d[i]*d[i];if(i>s&&(d[i]>0)!==(d[i-1]>0))zc++}const n=e-s,rms=Math.sqrt(sum/n),v=Math.min(1,zc/n*sr/2/4000);
 const hop=Math.floor(sr/100),env=[];for(let i=s;i+hop<e;i+=hop){let m=0;for(let j=0;j<hop;j+=4)m+=Math.abs(d[i+j]);env.push(m)}
 let best=0,bl=50;for(let l=30;l<=100;l++){let r=0;for(let i=0;i+l<env.length;i++)r+=env[i]*env[i+l];if(r>best){best=r;bl=l}}
 let bpm=6000/bl;while(bpm<70)bpm*=2;while(bpm>180)bpm/=2;
 return{bpm:Math.round(bpm),energy:Math.max(0,Math.min(1,+(rms*4+(bpm-60)/300).toFixed(2))),v}}catch(e){return null}}
const guess=(e,v)=>e>.75?"Sabay Sabay!":e>.65?(v>.5?"energetic":"happy"):e>.5?(v>.5?"happy":"focus"):e>.3?(v>.5?"dreamy":"calm"):(v>.5?"melancholy":"relapse");
async function analyzeMissing(){const todo=S.tracks.filter(t=>!t.an&&!t.fileUri);let i=0;for(const t of todo){setBusy("Analyzing mood "+ ++i+"/"+todo.length+"…");const r=await analyze(await idb("get",t.id));t.an=1;if(r){t.bpm=r.bpm;t.energy=r.energy;t.mood=guess(r.energy,r.v)}save();await new Promise(r=>setTimeout(r,30))}setBusy("");view()}
async function addFiles(fs){let i=0;for(const f of fs){if(!/\.mp3$/i.test(f.name))continue;setBusy("Adding "+ ++i+"/"+fs.length+"…");const key=f.name+f.size;if(S.tracks.some(t=>t.key===key))continue;const id="f"+Date.now()+i,n=f.name.replace(/\.[^.]+$/,""),p=n.split(" - ");await idb("put",id,f);
 S.tracks.push({id,key,title:p.length>1?p.slice(1).join(" - "):n,artist:p.length>1?p[0]:"Unknown",mood:"calm",energy:.5,bpm:100,file:1,dur:0});save()}
 view();await analyzeMissing();S.mix=null;await autoMix()}
async function autoMix(){if(!S.tracks.length)return;const day=new Date().toDateString();if(S.mix&&S.mix.day===day)return;const h=new Date().getHours(),m=h<11?"focus":h<17?"happy":h<22?"Sabay Sabay!":"relapse",en=h<17?.65:.35,mine=recommend(m,en,8);
 const arts=[...new Set(S.tracks.map(t=>t.artist).filter(a=>a!=="Unknown"))].slice(0,3);let on=[];
 for(const a of (arts.length?arts:[m+" music"]))on=on.concat(await search(a,2,m,en,"all"));
 const ids=[];mine.forEach((t,i)=>{ids.push(t.id);if(i%2===1&&on.length)ids.push(on.shift().id)});on.forEach(t=>ids.push(t.id));
 S.mix={day,ids:[...new Set(ids)],m};save();view()}
function mixHTML(){if(!S.mix)return"";const a=S.mix.ids.map(T).filter(Boolean);return`<h2>Made for you today · ${S.mix.m}</h2>${list(a)}<p><button data-a="mix">Refresh mix</button></p>`}
async function boot(){await autoScanDevice(false,false);await analyzeMissing();await autoMix()}

// Views
const row=(t,ids)=>`<div class="row"><button class="ic p" data-a="play" data-ids="${ids}" data-id="${t.id}">▶</button><div class="t"><b>${t.title}</b><small>${t.artist} · ${t.mood}${t.src?" · "+t.src:" · MP3"}</small></div>${t.online?(t.vid?`<span class="badge on">YT Full</span>`:`<button class="badge on" data-a="saveon" data-id="${t.id}">⬇ Save</button>`):`<span class="badge on">offline</span>`}<button class="ic" data-a="like" data-id="${t.id}">${S.liked.includes(t.id)?"♥":"♡"}</button></div>`;
const list=a=>a.map(t=>row(t,a.map(x=>x.id).join(","))).join("");
function sl(k,l,min,max,st,v,u){return`<label class="r"><span>${l}</span><span id="o-${k}">${v}${u}</span></label><input type="range" data-k="${k}" min="${min}" max="${max}" step="${st}" value="${v}">`}

function view(){let h="";if(!T(sel)&&S.tracks.length)sel=S.tracks[0].id;
 if(tab==="lib")h=`<p class="chips"><button class="p" data-a="autoscan">↻ Auto-Scan MP3 Folders</button><label class="btn">Pick MP3s manually<input type="file" id="fi" accept=".mp3,audio/mpeg" multiple hidden></label></p><small id="st">${busy||S.tracks.length+" MP3 tracks in your library"}</small><div id="scan-log" style="margin-top:6px;font-size:12px;color:#22d3ee">${toast}</div>${list(S.tracks)}`;
 if(tab==="srch"){
   const loc=sq?S.tracks.filter(t=>(t.title+" "+t.artist).toLowerCase().includes(sq.toLowerCase())):[];
   h=`<h2>Search Music</h2><div class="sbar"><input type="search" id="sq" placeholder="Song, artist, or OPM hugot…" value="${sq}"><button class="p" data-a="dosrch">Search</button></div>
   ${loc.length?`<h2>In Your Library (${loc.length})</h2>${list(loc)}`:""}
   ${sres.length?`<h2>Online Full Tracks (${sres.length})</h2>${list(sres)}`:(sq&&!busy?`<small>Tap Search to find full tracks from YouTube Music, Apple Music, Spotify &amp; Deezer.</small>`:"")}`;
 }
 if(tab==="mood")h=`<h2>How do you feel?</h2><div class="chips">${MOODS.map(m=>`<button class="chip ${m===mood?"sel":""}" data-a="mood" data-id="${m}">${m}</button>`).join("")}</div>${sl("en","Energy",0,1,.05,en,"")}<h2>Recommended</h2>${list(recommend(mood,en))}`;
 if(tab==="ai")h=mixHTML()+`<h2>AI playlist creator</h2>
   <div class="chips" style="margin-bottom:8px">${PLATFORMS.map(p=>`<button class="chip ${aiSrc===p.id?"sel":""}" data-a="aisrc" data-id="${p.id}">${p.n}</button>`).join("")}</div>
   <textarea id="pr" placeholder="e.g. Sabay Sabay! Chris Brown 2012 party & TikTok PH dance hits, or OPM relapse songs">${pv}</textarea>
   <p><button class="p" data-a="gen">Create playlist</button></p>
   ${ai.length?`<h2>Result</h2>${list(ai)}<button data-a="savepl">Save playlist</button>`:""}
   ${S.pls.length?`<h2>Saved</h2>${S.pls.map((p,i)=>`<div class="row"><div class="t"><b>${p.n}</b><small>${p.ids.length} tracks</small></div><button class="ic p" data-a="playpl" data-id="${i}">▶</button></div>`).join("")}`:""}`;
 if(tab==="cue"&&!T(sel))h="<h2>Cue editor</h2><small>Add music in Library first.</small>";
 if(tab==="cue"&&T(sel)){const c=cue(sel),m=mks(),th=S.thr;h=`<h2>Cue editor</h2><select id="ct" style="width:100%">${S.tracks.map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${x.title}</option>`).join("")}</select>
 <canvas id="wf" width="720" height="220"></canvas>
 <div class="chips">${[["start","START"],["next","NEXT"],["end","END"]].map(([n,l])=>`<button class="chip ${mk===n?"sel":""}" data-a="mk" data-id="${n}">${l} <b id="t-${n}">${f1(m[n])}</b></button>`).join("")}</div>
 <small>Pick a marker, then tap or drag on the waveform. START = where the song begins, NEXT = when the next song starts mixing in, END = where it stops.</small>
 ${sl("fi","Fade in",0,10,.5,c.fi||0,"s")}
 <h2>Auto select thresholds (dB)</h2><div class="chips">${[["s","Start"],["m","Mix"],["e","End"]].map(([k,l])=>`<label>${l} <input type="number" data-k="th-${k}" value="${th[k]}" min="-60" max="0" style="width:72px"></label>`).join("")}</div>
 <p class="chips"><button class="p" data-a="auto">Auto select</button><button data-a="prev8">Preview transition</button><button data-a="rst">Apply default</button><button data-a="mkdef">Save as default</button></p>`}
 if(tab==="set")h=`<h2>Waveform Synchronizer Style</h2>
   <div class="chips">${WF_STYLES.map(w=>`<button class="chip ${S.wfStyle===w.id?"sel":""}" data-a="wfst" data-id="${w.id}">${w.n}</button>`).join("")}</div>
   <h2>Equalizer &amp; Presets</h2>
   ${eqHTML()}
   <h2>Linked Music Folders (Auto-Scan MP3 Only)</h2>
   ${S.folders.map((f,i)=>`<div class="row"><div class="t"><b>📁 ${f}</b><small>/storage/emulated/0/${f}</small></div><button data-a="deldir" data-id="${i}" style="color:#f87171">✕</button></div>`).join("")}
   <div class="sbar"><input type="text" id="new-dir" placeholder="e.g. Music/Budots Remix"><button class="p" data-a="adddir">+ Link</button></div>
   <div class="row"><div class="t"><b>Relink Moved / Missing MP3s</b><small>Re-match moved files without losing Cue points</small></div><button class="p" data-a="relink">↻ Relink Now</button></div>
   <div id="relink-log" style="font-size:12px;color:#4ade80;margin-bottom:8px"></div>
   <h2>Network &amp; Audio</h2>
   <div class="row"><div class="t"><b>Pure offline mode</b><small>Only use saved local MP3 tracks in AI Mix &amp; playlists</small></div><input type="checkbox" data-k="offonly" ${S.offlineOnly?"checked":""}></div>
   <div class="row"><div class="t"><b>High-fidelity mode</b><small>${ctx?"Output "+ctx.sampleRate/1000+" kHz":"Requests 96 kHz, no processing"}</small></div><input type="checkbox" data-k="hifi" ${S.hifi?"checked":""}></div>
   <h2>Default cue settings</h2><div class="row"><div class="t"><b>Auto-apply to every track</b><small>New and imported tracks get these automatically</small></div><input type="checkbox" data-k="auto" ${S.def.auto?"checked":""}></div>${sl("dfade","Crossfade",0,12,.5,S.def.fade,"s")}${sl("din","Cue in",0,20,.5,S.def.in,"s")}${sl("dout","Cue out",0,20,.5,S.def.out,"s")}
   <h2>Device sync code</h2><textarea id="sy" readonly>${btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify({c:S.cues,d:S.def,l:S.liked,p:S.pls}))))}</textarea><p><button data-a="imp">Paste code from another device &amp; apply</button></p>`;
 $("#v").innerHTML=h+(toast&&tab!=="lib"?`<p><small>${toast}</small></p>`:"");
 $("#nav").innerHTML=[["lib","Library"],["srch","Search"],["mood","Mood"],["ai","AI"],["cue","Cues"],["set","Settings"]].map(x=>`<button data-a="tab" data-id="${x[0]}" class="${tab===x[0]?"sel":""}">${x[1]}</button>`).join("");if(tab==="cue"&&T(sel))drawWF()}

const net=()=>{$("#net").textContent=navigator.onLine?"online":"offline mode";$("#net").className="badge"+(navigator.onLine?" on":"")};
addEventListener("online",net);addEventListener("offline",net);

document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;toast="";
 if(a==="tab"){tab=id}
 else if(a==="autoscan"){const el=document.getElementById("scan-log");if(el)el.textContent="Starting scan…";autoScanDevice(true,false);return}
 else if(a==="relink"){autoScanDevice(true,true);return}
 else if(a==="adddir"){const inp=$("#new-dir");const v=inp&&inp.value.trim();if(v&&!S.folders.includes(v)){S.folders.push(v);save();view()}return}
 else if(a==="deldir"){S.folders.splice(+id,1);save();view();return}
 else if(a==="wfst"){S.wfStyle=id;save();view();return}
 else if(a==="cyclewf"){const idx=WF_STYLES.findIndex(x=>x.id===S.wfStyle);S.wfStyle=WF_STYLES[(idx+1)%WF_STYLES.length].id;save();return}
 else if(a==="eqpr"){const p=EQ_PRESETS.find(x=>x.n===id);if(p){S.eq.preset=p.n;S.eq.bands=[...p.g];applyEQ();save();renderDrawer();view()}return}
 else if(a==="dosrch"){sq=($("#sq")&&$("#sq").value||"").trim();if(!sq)return;toast="Searching across platforms…";view();sres=await search(sq,8,"calm",.5,"all");toast=sres.length?"":"No full streams found.";view();return}
 else if(a==="aisrc"){aiSrc=id}
 else if(a==="opennp"){npOpen=true;ui();return}
 else if(a==="closenp"){npOpen=false;ui();return}
 else if(a==="gocue"){npOpen=false;if(cur)sel=cur.t.id;tab="cue";ui();view();return}
 else if(a==="goai"){npOpen=false;tab="ai";ui();view();return}
 else if(a==="npsave"){if(cur&&cur.t.online)saveOffline(cur.t.id);return}
 else if(a==="saveon"){saveOffline(id);return}
 else if(a==="nplike"){if(cur){const tid=cur.t.id;S.liked=S.liked.includes(tid)?S.liked.filter(x=>x!==tid):[...S.liked,tid];save();ui();view()}return}
 else if(a==="npdrawer"){npDrawer=(npDrawer===id?"":id);renderDrawer();return}
 else if(a==="shuf"){shuf=!shuf;ui();return}
 else if(a==="rep"){rep=!rep;ui();return}
 else if(a==="playq"){cur&&playing?transition(+id):play(+id);return}
 else if(a==="play"){const ids=b.dataset.ids.split(",");setQ(ids,ids.indexOf(id),true);return}
 else if(a==="pp"){pp();return}else if(a==="next"){if(queue.length)(cur&&playing?transition():play(nextIdx()));return}else if(a==="prev"){if(queue.length)play((qi-1+queue.length)%queue.length);return}
 else if(a==="like"){S.liked=S.liked.includes(id)?S.liked.filter(x=>x!==id):[...S.liked,id]}
 else if(a==="mood"){mood=id}
 else if(a==="mk"){mk=id}else if(a==="auto"){await autoSel();toast="Markers set from thresholds."}
 else if(a==="mix"){toast="Building your mix…";view();S.mix=null;await autoMix();toast=""}
 else if(a==="gen"){pv=$("#pr").value||"";toast="Curating from "+PLATFORMS.find(x=>x.id===aiSrc).n+"…";view();ai=await genAI(pv);toast=""}
 else if(a==="savepl"){S.pls.push({n:($("#pr").value||"My mix").slice(0,28),ids:ai.map(t=>t.id)})}
 else if(a==="playpl"){setQ(S.pls[id].ids,0,true);return}
 else if(a==="mkdef"){const c=cue(sel);S.def={...S.def,in:c.in,out:c.out,fade:c.fade};toast="Saved as default for all tracks."}
 else if(a==="rst"){delete S.cues[sel]}
 else if(a==="prev8"){const i=S.tracks.findIndex(t=>t.id===sel),n=S.tracks[(i+1)%S.tracks.length];queue=[sel,n.id];const c=cue(sel);await play(0,Math.max(c.in,(T(sel).dur||60)-c.out-c.fade-3));return}
 else if(a==="imp"){const s=prompt("Paste sync code");try{const x=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));S={...S,cues:x.c,def:x.d,liked:x.l,pls:x.p};toast="Synced from other device."}catch(er){toast="Invalid code."}}
 save();ui();view()});

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="sq"){e.preventDefault();document.querySelector('[data-a="dosrch"]').click()}});

document.addEventListener("input",e=>{const el=e.target,k=el.dataset.k,v=+el.value;
 if(el.id==="sq"){sq=el.value;return}
 if(el.id==="np-seek"){seeking=true;$("#np-cur").textContent=fmt(v);return}
 if(el.id==="ct"){sel=el.value;view();return}
 if(k==="eqon"){S.eq.on=el.checked;applyEQ();save();return}
 if(k&&k.startsWith("eqb-")){const bi=+k.slice(4);S.eq.bands[bi]=v;S.eq.preset="Custom";const lbl=document.getElementById("eqdb-"+bi);if(lbl)lbl.textContent=(v>0?"+"+v:v)+"dB";applyEQ();save();return}
 if(k==="en"){en=v;$("#o-en").textContent=v;document.querySelectorAll(".row").forEach(r=>r.remove());$("#v").insertAdjacentHTML("beforeend",list(recommend(mood,en)));return}
 if(k&&k.startsWith("th-")){S.thr[k.slice(3)]=v;save();return}
 if(["in","out","fade","fi"].includes(k)){S.cues[sel]={...cue(sel),[k]:v};$("#o-"+k).textContent=v+"s";save();view();return}
 if(k==="dfade"||k==="din"||k==="dout"){S.def[k.slice(1)]=v;$("#o-"+k).textContent=v+"s";save();return}
 if(k==="auto"){S.def.auto=el.checked;save()}
 if(k==="offonly"){S.offlineOnly=el.checked;save();view()}
 if(k==="hifi"){S.hifi=el.checked;playing=false;cur&&cur.stop();cur=null;ctx&&ctx.close();ctx=null;save();ui();view()}});

document.addEventListener("change",e=>{
 if(e.target.id==="np-seek"){if(cur)cur.seek(+e.target.value);seeking=false;return}
 if(e.target.id==="fi")addFiles([...e.target.files])
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.tracks.length===0)autoScanDevice(false,false)});
net();ui();view();boot();
</script></body></html>
